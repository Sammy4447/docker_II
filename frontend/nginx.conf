server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS; the variable defers lookup so nginx still starts without a backend container
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:5000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
