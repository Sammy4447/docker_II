server {
    listen 80;
    # nginx listens on 80 inside the container; compose maps host 3000 -> this 80

    server_name _;
    # matches any hostname/IP the request comes in on

    root /usr/share/nginx/html;
    # where the React build output was copied to in the Dockerfile

    index index.html;
    # default file served for directory requests

    # Docker's internal DNS; the variable defers lookup so nginx still starts without a backend container
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # any request to /api/* is proxied to the backend container instead of being served as a static file
        set $backend http://backend:5000;
        # "backend" is the compose service name, resolved via Docker's DNS above
        proxy_pass $backend;
        proxy_set_header Host $host;
        # forwards the original Host header the browser sent
        proxy_set_header X-Real-IP $remote_addr;
        # forwards the real client IP to the backend (otherwise it would see nginx's internal IP)
    }

    location / {
        # SPA routing: if the requested file/path doesn't exist, fall back to index.html
        # so client-side routes (e.g. /reviews) don't 404 on a hard refresh
        try_files $uri $uri/ /index.html;
    }
}
