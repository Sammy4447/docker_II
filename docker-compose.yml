services:
  mongo:
    image: mongo:7
    container_name: momo-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    image: momo-backend
    container_name: momo-backend
    environment:
      - MONGO_URL=mongodb://mongo:27017/momo
      - PORT=5000
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: momo-frontend
    container_name: momo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
